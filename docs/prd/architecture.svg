<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#0d9488;stroke-width:1.4}
      .rbox{fill:#fff;stroke:#64748b;stroke-width:1.4}
      .cbox{fill:#ccfbf1;stroke:#0d9488;stroke-width:1.4}
      .grp{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
      .t{font-weight:600;fill:#0f172a;text-anchor:middle}
      .s{fill:#475569;font-size:10.5px;text-anchor:middle}
      .lbl{fill:#0f766e;font-size:10.5px;font-weight:700;letter-spacing:1px}
      .h{font-weight:700;fill:#0f172a;font-size:13px;text-anchor:middle}
      .ln{stroke:#334155;stroke-width:1.4;fill:none}
      .dash{stroke:#0f766e;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
      .note{fill:#64748b;font-size:10.5px;font-style:italic}
    </style>
  </defs>

  <text x="600" y="24" class="h" font-size="16">MCP Shield — System Architecture</text>

  <!-- Elicitation loop -->
  <path class="dash" d="M694,130 V52 H115 V108" marker-end="url(#aht)"/>
  <text x="200" y="46" fill="#0f766e" font-size="11">approval request (InputRequiredResult) → user approves → client retries the same call · legacy clients: live elicitation</text>

  <!-- Clients -->
  <rect x="20" y="110" width="190" height="330" rx="10" class="grp"/>
  <text x="115" y="132" class="h">MCP Clients</text>
  <rect x="40" y="148" width="150" height="50" rx="7" class="rbox"/><text x="115" y="169" class="t">Claude Desktop</text><text x="115" y="185" class="s">stdio</text>
  <rect x="40" y="215" width="150" height="50" rx="7" class="rbox"/><text x="115" y="236" class="t">Claude Code</text><text x="115" y="252" class="s">stdio / HTTP</text>
  <rect x="40" y="282" width="150" height="50" rx="7" class="rbox"/><text x="115" y="303" class="t">Cursor / IDE agents</text><text x="115" y="319" class="s">stdio / HTTP</text>
  <rect x="40" y="349" width="150" height="50" rx="7" class="rbox"/><text x="115" y="370" class="t">MCP Inspector</text><text x="115" y="386" class="s">testing &amp; demo</text>
  <text x="115" y="425" class="note" text-anchor="middle">JSON-RPC 2.0 over MCP</text>

  <!-- Shield container -->
  <rect x="250" y="70" width="640" height="520" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="268" y="94" font-weight="700" fill="#0f766e" font-size="14">MCP Shield  ·  Python 3.12 · MCP Python SDK v2 · asyncio</text>

  <!-- Request path -->
  <text x="270" y="120" class="lbl">REQUEST PATH  →</text>
  <rect x="270" y="130" width="104" height="64" rx="7" class="box"/><text x="322" y="155" class="t">Server Face</text><text x="322" y="171" class="s">low-level Server</text><text x="322" y="184" class="s">2026 + legacy</text>
  <rect x="394" y="130" width="104" height="64" rx="7" class="box"/><text x="446" y="155" class="t">Policy Engine</text><text x="446" y="171" class="s">allow / deny</text><text x="446" y="184" class="s">rate limits</text>
  <rect x="518" y="130" width="104" height="64" rx="7" class="box"/><text x="570" y="155" class="t">Arg Scanner</text><text x="570" y="171" class="s">schema validation</text><text x="570" y="184" class="s">traversal · exfil</text>
  <rect x="642" y="130" width="104" height="64" rx="7" class="box"/><text x="694" y="155" class="t">Approval</text><text x="694" y="171" class="s">multi-round-trip</text><text x="694" y="184" class="s">sealed · 5 min</text>
  <rect x="766" y="130" width="104" height="64" rx="7" class="box"/><text x="818" y="155" class="t">Router</text><text x="818" y="171" class="s">config-id prefix</text><text x="818" y="184" class="s">tool pins</text>
  <path class="ln" d="M374,162 H392" marker-end="url(#ah)"/>
  <path class="ln" d="M498,162 H516" marker-end="url(#ah)"/>
  <path class="ln" d="M622,162 H640" marker-end="url(#ah)"/>
  <path class="ln" d="M746,162 H764" marker-end="url(#ah)"/>

  <!-- Response path -->
  <text x="270" y="232" class="lbl">←  RESPONSE PATH</text>
  <rect x="766" y="242" width="104" height="64" rx="7" class="rbox"/><text x="818" y="267" class="t">Collector</text><text x="818" y="283" class="s">validate result</text><text x="818" y="296" class="s">isolate errors</text>
  <rect x="642" y="242" width="104" height="64" rx="7" class="rbox"/><text x="694" y="267" class="t">Result Scanner</text><text x="694" y="283" class="s">injection · unicode</text><text x="694" y="296" class="s">tool poisoning</text>
  <rect x="518" y="242" width="104" height="64" rx="7" class="rbox"/><text x="570" y="267" class="t">Redactor</text><text x="570" y="283" class="s">secrets · PII</text><text x="570" y="296" class="s">before audit</text>
  <rect x="394" y="242" width="104" height="64" rx="7" class="rbox"/><text x="446" y="267" class="t">Context Budget</text><text x="446" y="283" class="s">token limit</text><text x="446" y="296" class="s">warn / truncate</text>
  <rect x="270" y="242" width="104" height="64" rx="7" class="rbox"/><text x="322" y="267" class="t">Reply</text><text x="322" y="283" class="s">denials: is_error</text><text x="322" y="296" class="s">+ request ID</text>
  <path class="ln" d="M766,274 H748" marker-end="url(#ah)"/>
  <path class="ln" d="M642,274 H624" marker-end="url(#ah)"/>
  <path class="ln" d="M518,274 H500" marker-end="url(#ah)"/>
  <path class="ln" d="M394,274 H376" marker-end="url(#ah)"/>

  <!-- client <-> shield -->
  <path class="ln" d="M190,173 H268" marker-end="url(#ah)"/>
  <text x="229" y="166" class="s">request</text>
  <path class="ln" d="M270,286 H212" marker-end="url(#ah)"/>
  <text x="240" y="300" class="s">response</text>

  <!-- telemetry bus -->
  <path class="dash" d="M322,306 V326 M446,306 V326 M570,306 V326 M694,306 V326 M818,306 V326 M322,326 H818"/>
  <path class="dash" d="M365,326 V352" marker-end="url(#aht)"/>
  <path class="dash" d="M575,326 V352" marker-end="url(#aht)"/>
  <text x="600" y="343" fill="#0f766e" font-size="10.5">payloads · verdicts · findings · stage timings</text>

  <!-- Cross-cutting -->
  <rect x="270" y="354" width="190" height="84" rx="8" class="cbox"/>
  <text x="365" y="376" class="t">Token Meter</text>
  <text x="365" y="393" class="s">tiktoken · provider count_tokens</text>
  <text x="365" y="407" class="s">request (once per call) · response</text>
  <text x="365" y="421" class="s">schema per turn · est. cost</text>

  <rect x="480" y="354" width="190" height="84" rx="8" class="cbox"/>
  <text x="575" y="376" class="t">Audit Logger</text>
  <text x="575" y="393" class="s">1 row per request · logical_call_id</text>
  <text x="575" y="407" class="s">async bounded queue (10k)</text>
  <text x="575" y="421" class="s">JSONL spool on DB failure</text>
  <path class="ln" d="M460,396 H478" marker-end="url(#ah)"/>

  <rect x="690" y="354" width="180" height="84" rx="8" class="cbox"/>
  <text x="780" y="376" class="t">Config &amp; Policy</text>
  <text x="780" y="393" class="s">servers.yaml · policy.yaml</text>
  <text x="780" y="407" class="s">pricing.yaml · hot reload</text>
  <text x="780" y="421" class="s">policy hash · tool pin hashes</text>

  <!-- verdict legend -->
  <text x="270" y="470" class="lbl">VERDICTS</text>
  <g font-size="11" font-weight="600">
    <rect x="270" y="480" width="64" height="22" rx="11" fill="#dcfce7"/><text x="302" y="495" text-anchor="middle" fill="#166534">allow</text>
    <rect x="342" y="480" width="64" height="22" rx="11" fill="#fef3c7"/><text x="374" y="495" text-anchor="middle" fill="#92400e">warn</text>
    <rect x="414" y="480" width="64" height="22" rx="11" fill="#fee2e2"/><text x="446" y="495" text-anchor="middle" fill="#991b1b">block</text>
    <rect x="486" y="480" width="80" height="22" rx="11" fill="#dbeafe"/><text x="526" y="495" text-anchor="middle" fill="#1e40af">approved</text>
    <rect x="574" y="480" width="64" height="22" rx="11" fill="#fee2e2"/><text x="606" y="495" text-anchor="middle" fill="#991b1b">denied</text>
    <rect x="646" y="480" width="70" height="22" rx="11" fill="#fef3c7"/><text x="681" y="495" text-anchor="middle" fill="#92400e">expired</text>
    <rect x="724" y="480" width="56" height="22" rx="11" fill="#e2e8f0"/><text x="752" y="495" text-anchor="middle" fill="#334155">error</text>
  </g>
  <text x="270" y="530" class="note">Fail-closed: internal scanner / policy errors → block (unless fail_open: true).</text>
  <text x="270" y="548" class="note">Redaction runs before the client reply AND the audit write — raw secrets never reach disk.</text>
  <text x="270" y="566" class="note">Progress, cancelled, list_changed pass through · ping answered locally · client tokens never forwarded.</text>

  <!-- Upstreams -->
  <rect x="930" y="70" width="250" height="520" rx="10" class="grp"/>
  <text x="1055" y="94" class="h">Upstream MCP Servers</text>
  <text x="1055" y="110" class="note" text-anchor="middle">untrusted — descriptions &amp; results scanned</text>
  <rect x="955" y="125" width="205" height="54" rx="7" class="rbox"/><text x="1057" y="148" class="t">Filesystem MCP</text><text x="1057" y="165" class="s">stdio · sandboxed dir</text>
  <rect x="955" y="195" width="205" height="54" rx="7" class="rbox"/><text x="1057" y="218" class="t">GitHub MCP</text><text x="1057" y="235" class="s">Streamable HTTP · bearer token</text>
  <rect x="955" y="265" width="205" height="54" rx="7" class="rbox"/><text x="1057" y="288" class="t">Postgres / internal MCP</text><text x="1057" y="305" class="s">stdio</text>
  <rect x="955" y="335" width="205" height="54" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="1057" y="358" class="t" fill="#991b1b">Demo poisoned server</text><text x="1057" y="375" class="s">attack fixtures for demo</text>
  <text x="1057" y="420" class="note" text-anchor="middle">tools/list → pin + schema_tokens</text>
  <text x="1057" y="438" class="note" text-anchor="middle">tools/call → response_tokens per tool</text>
  <text x="1057" y="462" class="note" text-anchor="middle" fill="#991b1b">sampling / elicitation / roots requests</text>
  <text x="1057" y="478" class="note" text-anchor="middle" fill="#991b1b">from upstreams → refused (v1)</text>

  <!-- router bar -->
  <path class="ln" d="M870,162 H912"/>
  <path class="ln" d="M912,152 V362"/>
  <path class="ln" d="M912,152 H953" marker-end="url(#ah)"/>
  <path class="ln" d="M912,222 H953" marker-end="url(#ah)"/>
  <path class="ln" d="M912,292 H953" marker-end="url(#ah)"/>
  <path class="ln" d="M912,362 H953" marker-end="url(#ah)"/>
  <path class="ln" d="M912,274 H872" marker-end="url(#ah)"/>

  <!-- Storage & observability band -->
  <text x="270" y="618" class="lbl">STORAGE &amp; OBSERVABILITY</text>
  <rect x="270" y="630" width="260" height="120" rx="8" fill="#fff" stroke="#334155" stroke-width="1.4"/>
  <text x="400" y="654" class="t">Audit Store — SQLite (WAL)</text>
  <text x="400" y="676" class="s">connections · requests · token_usage</text>
  <text x="400" y="692" class="s">findings · policy_versions · upstreams · tool_pins</text>
  <text x="400" y="712" class="s">redacted payloads (≤ 64 KB) · retention 30 d</text>
  <text x="400" y="728" class="s">indexed by time · connection · tool · verdict</text>

  <rect x="580" y="630" width="220" height="120" rx="8" fill="#fff" stroke="#334155" stroke-width="1.4"/>
  <text x="690" y="654" class="t">Audit Dashboard (Streamlit)</text>
  <text x="690" y="676" class="s">Overview KPIs · Request explorer</text>
  <text x="690" y="692" class="s">Request detail · Token analytics</text>
  <text x="690" y="708" class="s">Security events · Upstreams &amp; policy</text>
  <text x="690" y="728" class="s">+ optional shield_* MCP tools</text>

  <rect x="850" y="630" width="200" height="120" rx="8" fill="#fff" stroke="#334155" stroke-width="1.4"/>
  <text x="950" y="654" class="t">Export &amp; Integrations</text>
  <text x="950" y="676" class="s">shield export → CSV / JSON</text>
  <text x="950" y="692" class="s">(redacted only)</text>
  <text x="950" y="712" class="s">OpenTelemetry spans (SDK v2)</text>
  <text x="950" y="728" class="s">+ verdict &amp; token attributes</text>

  <rect x="40" y="655" width="170" height="70" rx="8" class="grp"/>
  <text x="125" y="684" class="t">Engineer /</text>
  <text x="125" y="700" class="t">Security reviewer</text>

  <path class="ln" d="M650,438 V452 H878 V604 H500 V628" marker-end="url(#ah)"/>
  <text x="760" y="601" class="s">AuditRecord (async)</text>
  <path class="ln" d="M530,690 H578" marker-end="url(#ah)"/>
  <text x="554" y="682" class="s">query</text>
  <path class="ln" d="M800,690 H848" marker-end="url(#ah)"/>
  <text x="824" y="682" class="s">export</text>
  <path class="ln" d="M125,725 V775 H690 V752" marker-end="url(#ah)"/>
  <text x="400" y="770" class="s">views requests, tokens, findings</text>
</svg>
