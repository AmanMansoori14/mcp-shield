# MCP Shield process settings. Paths are relative to this file.
servers: servers.yaml
policy: policy.yaml
pricing: pricing.yaml

audit_tools: true        # expose read-only shield_* tools to the agent
refresh_interval_s: 30   # re-list upstreams to catch changed tool definitions

audit:
  db_path: shield-audit.db
  spool_path: shield-audit.spool.jsonl
  spool_alert_mb: 100     # log an error if the spool (DB not taking writes) grows past this
  retention_days: 30

tokenizer:
  kind: tiktoken          # tiktoken | char
  encoding: o200k_base
  image_tokens: 1500      # fixed estimate per image/audio block
