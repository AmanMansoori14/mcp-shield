# Upstream MCP servers. The id becomes the tool prefix: notes__echo, notes__read_note, ...
servers:
  - id: notes
    transport: stdio
    command: ["uv", "run", "python", "-m", "demo.benign_server"]
    timeout_s: 30

  # DEMO ONLY: a deliberately malicious server so you can watch Shield block it.
  - id: evil
    transport: stdio
    command: ["uv", "run", "python", "-m", "demo.poisoned_server"]
    timeout_s: 30

  # More examples (uncomment to use):
  # - id: fs
  #   transport: stdio
  #   command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "./sandbox"]
